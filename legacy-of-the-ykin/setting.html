            <p class="page-subtitle">Lore, geography, cultures, and cities — rendered from markdown.</p>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div class="landscape-cards">
                <a class="landscape-card" href="setting-tanara.html" style="--card-bg: url('/legacy-of-the-ykin/images/tanara-map.png');">
                    <div class="landscape-card__overlay"></div>

    <footer class="footer">

    <script src="../script.js"></script>
    <script>
        // Populate card descriptions from markdown YAML frontmatter (description: "...").
        // This keeps the card copy in sync with the source-of-truth setting files.
        async function loadFrontmatterDescription(url) {
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
            const text = (await res.text()).replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
            if (!text.startsWith('---\n')) return null;
            const end = text.indexOf('\n---\n');
            if (end === -1) return null;
            const fm = text.slice(4, end).split('\n');
            for (const line of fm) {
                const m = line.match(/^description:\s*(.*)\s*$/);
                if (!m) continue;
                let v = m[1].trim();
                if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                    v = v.slice(1, -1);
                }
                return v;
            }
            return null;
        }

        (async function hydrateSettingCards() {
            const mappings = [
                { href: 'setting-tanara.html', md: 'markdown/setting/tanara.md' },
                { href: 'setting-the-city-of-achren.html', md: 'markdown/setting/the-city-of-achren.md' },
            ];

            await Promise.all(mappings.map(async ({ href, md }) => {
                const card = document.querySelector(`.landscape-card[href="${href}"]`);
                if (!card) return;
                const descEl = card.querySelector('.landscape-card__description');
                if (!descEl) return;

                try {
                    const desc = await loadFrontmatterDescription(md);
                    if (desc) descEl.textContent = desc;
                } catch {
                    // Silent fallback: keep author-provided HTML copy.
                }
            }));
        })();
    </script>
</body>
</html>
